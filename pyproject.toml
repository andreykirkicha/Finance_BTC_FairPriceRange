[project]
name = "btc-option-research"
version = "0.1.0"
description = "Deribit market data for BTC inverse option price intervals"
requires-python = ">=3.10"
dependencies = ["scipy>=1.15"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
